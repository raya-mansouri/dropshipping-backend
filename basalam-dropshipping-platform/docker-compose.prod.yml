# Production overlay — run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Dev tools (kafka-ui, minio) are excluded via profiles in the base file.
# This file adds production-specific overrides.

services:

  api:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      UVICORN_WORKERS: 4
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      CELERY_CONCURRENCY: 8
      CELERY_MAX_TASKS_PER_CHILD: 500
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: warning
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  consumer:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: info
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  kafka:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
